name: Badge
description: Write the cukes badge block into the open PR body

inputs:
  run-id:
    description: Run id in the badge URL, busts the camo cache
    required: true
  only-missing:
    description: Skip the edit when the PR body already has a badge block
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Find open PR for branch
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        number=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')
        echo "number=$number" >> "$GITHUB_OUTPUT"

    - name: Add badge block to PR
      if: steps.pr.outputs.number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        PREFIX: ${{ steps.pr.outputs.number }}/
        RUN_ID: ${{ inputs.run-id }}
        ONLY_MISSING: ${{ inputs.only-missing }}
      run: |
        gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.body // ""' > /tmp/body.md
        if [ "$ONLY_MISSING" = true ] && grep -q '<!-- badges-start -->' /tmp/body.md; then
          exit 0
        fi
        ruby ops/ci/badges/body.rb
        gh api -X PATCH "repos/${{ github.repository }}/pulls/$PR_NUMBER" -F body=@/tmp/body.md
