name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - run: npm test

  cukes:
    needs: [lint, test]
    uses: ./.github/workflows/cukes.yml

  site:
    needs: [cukes]
    if: ${{ !cancelled() && needs.cukes.result != 'skipped' }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml

  body:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/badge
        with:
          run-id: ${{ github.run_id }}-0
          only-missing: true

  badge:
    needs: [site]
    if: ${{ !cancelled() && needs.site.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/badge
        with:
          run-id: ${{ github.run_id }}

  check:
    needs: [badge]
    if: ${{ !cancelled() && needs.badge.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - run: ruby ops/ci/check/check.rb
        env:
          GH_TOKEN: ${{ github.token }}
