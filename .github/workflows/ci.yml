name: CI

on:
  push:
    branches-ignore: [badges]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  delete:

permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.event_name != 'delete' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - run: npm run lint

  test:
    if: ${{ github.event_name != 'delete' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - run: npm test

  cukes:
    needs: [lint, test]
    uses: ./.github/workflows/cukes.yml

  badges:
    needs: [cukes]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write
    uses: limadelic/badge/.github/workflows/badge.yml@v1
    with:
      labels: cukes=report.html
    secrets: inherit
