name: CI

on:
  push:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - run: npm test

  cukes:
    needs: [lint, test]
    uses: ./.github/workflows/cukes.yml

  site:
    needs: [cukes]
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml

  badge:
    needs: [site]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Find open PR for branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          number=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Add badge block to PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREFIX: ${{ steps.pr.outputs.number }}/
          RUN_ID: ${{ github.run_id }}
        run: |
          gh pr view "$PR_NUMBER" --json body -q .body > /tmp/body.md
          ruby ops/ci/badges/body.rb
          gh pr edit "$PR_NUMBER" --body-file /tmp/body.md
