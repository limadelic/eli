name: CI

on:
  push:
    branches-ignore: [badges]
  pull_request:
    types: [opened, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - run: npm run lint

  test:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - run: npm test

  cukes:
    needs: [lint, test]
    uses: ./.github/workflows/cukes.yml

  site:
    needs: [cukes]
    if: ${{ !cancelled() && needs.cukes.result != 'skipped' }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml

  body:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/badge
        with:
          run-id: ${{ github.run_id }}-0
          only-missing: true

  badge:
    needs: [site]
    if: ${{ !cancelled() && needs.site.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/badge
        with:
          run-id: ${{ github.run_id }}

  check:
    needs: [badge]
    if: ${{ !cancelled() && needs.badge.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - run: ruby ops/ci/check/check.rb
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  prune:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: List prefix to drop
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ruby ops/ci/site/prefix.rb prune > "$RUNNER_TEMP/prefixes"

      - uses: actions/checkout@v4
        with:
          ref: badges
          path: site

      - name: Remove prefix
        working-directory: site
        run: |
          while IFS= read -r prefix; do
            git rm -r -q --ignore-unmatch -- "${prefix%/}"
          done < "$RUNNER_TEMP/prefixes"

      - name: Commit and push pruned badges
        working-directory: site
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -qm "Prune badges from run $RUN_ID"
            git push -q origin HEAD:badges
          fi

      - name: Stage Pages files
        run: rsync -a --exclude .git site/ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
