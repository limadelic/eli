name: Cukes

on: workflow_call

permissions:
  contents: read

jobs:
  cukes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - name: Run Cucumber tests
        run: |
          mkdir -p reports
          bundle exec cucumber --format progress --format html --out reports/report.html --format json --out reports/cucumber.json

      - id: cukes
        if: ${{ !cancelled() }}
        uses: limadelic/badge/cukes@v1.1
        with:
          json: reports/cucumber.json

      - if: ${{ !cancelled() }}
        uses: limadelic/badge/make@v1.1
        with:
          label: cukes
          message: ${{ steps.cukes.outputs.message }}
          color: ${{ steps.cukes.outputs.color }}
          files: reports/cucumber.json reports/report.html
          link: report.html
          logo: cucumber

      - name: Upload Cucumber report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cukes-report-${{ github.run_id }}
          path: reports/
